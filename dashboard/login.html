<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — SMCPE Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/dashboard.css"></head>
<body data-page="login"><div class="app" style="justify-content:center;align-items:center;min-height:100vh;background:var(--bg)">
<div class="card" style="max-width:420px;width:100%;margin:40px auto">
<h1 style="margin:0 0 8px">تسجيل الدخول · SMCPE</h1>
<p class="lede" style="color:var(--muted)">Nile Agro Trading — owner@nileagro.sd / admin123 (demo)</p>
<form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
<div class="field"><label>البريد</label><input id="email" type="email" required value="owner@nileagro.sd" placeholder="owner@nileagro.sd"></div>
<div class="field"><label>كلمة المرور</label><input id="password" type="password" required value="admin123" placeholder="••••••••"></div>
<button class="btn btn-primary" type="submit">دخول</button>
<p id="msg" class="note" style="min-height:1.2em;color:var(--bad)"></p>
</form>
<p class="note">API: <span class="mono" id="apiStatus">checking…</span></p>
</div></div>
<script src="js/config.js"></script>
<script>
fetch("/api/health").then(r=>r.json()).then(j=>{ document.getElementById("apiStatus").textContent = j.ok ? "libpayroll.so " + (j.version||"") + " ✓" : "down"; }).catch(()=>{ document.getElementById("apiStatus").textContent="offline (fallback demo)"; });
document.getElementById("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const msg=document.getElementById("msg");
  msg.textContent="…";
  try{
    const res=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});
    if(!res.ok) throw new Error(await res.text());
    const j=await res.json();
    try{ localStorage.setItem("smcpe-jwt", j.access_token); }catch(e){}
    location.href="index.html";
  }catch(err){ msg.textContent="فشل الدخول: " + (err.message||err); }
});
</script>
</body></html>
