limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name localhost pay.local;

    # Landing page at /
    root /home/projects/smcpe/landing-page;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dashboard at /app/
    location /app/ {
        alias /home/projects/smcpe/dashboard/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Health without prefix for direct checks
    location = /health {
        proxy_pass http://127.0.0.1:8000/api/health;
    }

    access_log /var/log/nginx/smcpe-access.log;
    error_log /var/log/nginx/smcpe-error.log;

    # Gzip for low bandwidth
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
