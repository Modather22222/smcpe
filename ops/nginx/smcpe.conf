limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

server {
    listen 80;
    server_name localhost pay.local;

    root /home/projects/smcpe/landing-page;
    index index.html;

    # Security headers — best practice for payroll (even on localhost http, HSTS only for https)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP minimal for localhost (allow self + fonts.googleapis.com + cdn for HTMX if used)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    client_max_body_size 2m;
    server_tokens off;

    # Landing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — cache 1y, immutable (hashed via ETag)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    # Landing static
    location = /css/main.css { alias /home/projects/smcpe/landing-page/css/main.css; }
    location = /js/main.js { alias /home/projects/smcpe/landing-page/js/main.js; }

    # Dashboard at /app/
    location /app/ {
        alias /home/projects/smcpe/dashboard/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location ~* ^/app/.*\.(css|js)$ {
        alias /home/projects/smcpe/dashboard/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy — rate limit, timeouts, headers
    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # Samples — synthetic, public, no auth, for demo
    location /samples/ {
        alias /home/projects/smcpe/samples/;
        autoindex on;
        autoindex_exact_size off;
        add_header Cache-Control "public, max-age=3600" always;
        # Trustworthy: add header to mark synthetic
        add_header X-SMCPE-Samples "synthetic-demo-only" always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/api/health;
        access_log off;
    }

    access_log /var/log/nginx/smcpe-access.log;
    error_log /var/log/nginx/smcpe-error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;
}

